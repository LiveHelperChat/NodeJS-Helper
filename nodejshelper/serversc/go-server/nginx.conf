# Reverse proxy for the scaled NodeJS Helper stack (docker-compose.scaled.yml).
#
# Mounted at /etc/nginx/conf.d/default.conf, so every directive below is inside the
# `http` block and `map` is allowed here.
#
# Round robin is intentional: the servers share all state through Redis, so no
# `ip_hash` / sticky sessions are needed - any node can serve any browser.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Which backend served a request is the first thing you want to know when something
# behaves differently on one node - visible in `docker compose logs nginx`.
log_format upstream '$remote_addr -> $upstream_addr "$request" $status';

# `max_fails`/`fail_timeout` are passive checks: a backend that refuses connections
# (container stopped/restarting) is taken out for 10s, then retried.
# A backend that is up but whose Redis bridge is broken still accepts connections, so
# nginx alone cannot detect that - monitor /health-check per node (it answers 503) and
# use a health aware proxy (Traefik, or a container platform that acts on healthchecks)
# if you need that drained automatically.
upstream golhchelper {
    server golhchelper-1:8000 max_fails=2 fail_timeout=10s;
    server golhchelper-2:8000 max_fails=2 fail_timeout=10s;
    keepalive 64;
}

server {
    listen 80;

    access_log /dev/stdout upstream;

    # Websocket endpoint used by the widget and the back office.
    location /socketcluster/ {
        proxy_pass http://golhchelper;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Long lived connections. The server pings every 8s, so this is only a safety net.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Behind TLS this is the health endpoint your monitor should poll.
    location = /health-check {
        proxy_pass http://golhchelper;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # Anything else (the optional public/ directory of the server).
    location / {
        proxy_pass http://golhchelper;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }
}

